name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          # Lets the gh CLI authenticate if Claude invokes `gh pr create` via Bash
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Branch from staging instead of main (default branch)
          base_branch: staging

          # Branch naming: uses GitHub labels (feature, fix, chore) as prefix
          # Requires issues to have a matching label, otherwise falls back to "claude/"
          branch_prefix: ""
          branch_name_template: "{{label}}/issue-{{entityNumber}}-{{timestamp}}"

          additional_permissions: |
            actions: read

          # NOTE: do not set `prompt` here — on issue_comment/issues events, the
          # action forces "agent" mode whenever `prompt` is non-empty, which skips
          # automatic issue-context injection and reply-comment posting (tag mode).
          # Use --append-system-prompt instead so @claude mentions keep full context.
          claude_args: |
            --allowedTools "Bash(gh pr create:*),Bash(gh pr view:*)"
            --append-system-prompt 'Follow these git conventions strictly for any commits or PRs you create:

            Commit messages: Use conventional commits format
              <type>: <description>
            Types: feat, fix, chore, refactor, docs, test, style, perf
            - Lowercase type, lowercase description, no period at end
            - Imperative mood ("add" not "added")
            - Under 72 characters

            PR titles: Derive from branch name or summarize commits
            PR body: Include Summary, Changes, and Test Plan sections

            Always end commits with:
            Co-Authored-By: Claude Opus 4.5 <noreply@anthropic.com>

            Target all PRs to the staging branch, never to main directly.

            After committing and pushing all your changes, open the pull request
            yourself instead of just leaving a pre-filled PR link — run:
              gh pr create --base staging --head <your-branch-name> --title "<type>: <description>" --body "<summary>"
            Only run this once, after all commits for the task are pushed. The PR
            must be a normal ready-for-review PR, not a draft. If `gh pr create`
            fails due to authentication or permissions, fall back to reporting the
            pre-filled PR link as before instead of retrying repeatedly.'
