name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        # Non-blocking for now: the suite has a known async-mock baseline of
        # failures (sync tests vs async services). This reports results without
        # gating merges until that baseline is repaired, at which point drop
        # continue-on-error to make pytest a hard gate.
        continue-on-error: true
        run: pytest -q

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # Publishable keys are public by design (embedded in the client bundle),
      # so a Clerk test key here is not a secret. Override with a repo variable
      # (Settings → Secrets and variables → Actions → Variables) if desired.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_Y3VkZGx5LWdsb3d3b3JtLTQ4LmNsZXJrLmFjY291bnRzLmRldiQ' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        # Report-only for now: there's a known baseline of pre-existing lint
        # errors (react-hooks rules). Drop continue-on-error to make lint a hard
        # gate once that baseline is cleared.
        continue-on-error: true
        run: npm run lint
      - name: Build
        # Hard gate: a broken production build blocks the merge.
        run: npm run build
