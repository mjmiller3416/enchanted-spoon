# Manual Play release for the Capacitor Android app (com.enchantedspoon.app).
# workflow_dispatch only, on a free GitHub-hosted ubuntu runner.
# This file does not run on pull requests or pushes.
#
# The first AAB still has to be uploaded by hand in Play Console. The Play
# Developer API rejects uploads until the application id exists. Leave the
# upload input off for that build, download the artifact, and upload it in
# the console while enrolling in Play App Signing.

name: Android release

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play track. internal = internal testing. alpha = the closed testing track."
        type: choice
        options:
          - internal
          - alpha
        default: internal
      upload:
        description: "Upload the signed AAB to the selected Play track. Leave off to only keep the GitHub artifact."
        type: boolean
        default: false

concurrency:
  group: android-release-${{ inputs.track }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bundle:
    name: Signed release bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Sync the Capacitor Android project
        working-directory: frontend
        env:
          # The shell loads the hosted site. Do not bake a LAN or cleartext URL.
          CAPACITOR_SERVER_URL: https://enchantedspoon.app
        run: npx cap sync android

      - name: Install Android SDK
        run: |
          set -euo pipefail
          sdk_root="${RUNNER_TEMP}/android-sdk"
          mkdir -p "${sdk_root}/cmdline-tools"
          curl -fsSL -o "${RUNNER_TEMP}/commandlinetools.zip" \
            "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip"
          unzip -q "${RUNNER_TEMP}/commandlinetools.zip" -d "${sdk_root}/cmdline-tools"
          mv "${sdk_root}/cmdline-tools/cmdline-tools" "${sdk_root}/cmdline-tools/latest"
          echo "ANDROID_HOME=${sdk_root}" >> "${GITHUB_ENV}"
          echo "${sdk_root}/cmdline-tools/latest/bin" >> "${GITHUB_PATH}"
          echo "${sdk_root}/platform-tools" >> "${GITHUB_PATH}"
          set +o pipefail
          yes | "${sdk_root}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${sdk_root}" --licenses >/dev/null || true
          set -o pipefail
          if [[ ! -s "${sdk_root}/licenses/android-sdk-license" ]]; then
            echo "Android SDK licenses were not accepted."
            exit 1
          fi
          "${sdk_root}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${sdk_root}" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # ubuntu-latest also exports ANDROID_SDK_ROOT to the preinstalled SDK.
      # Gradle refuses to run when that path differs from ANDROID_HOME.
      - name: Align ANDROID_SDK_ROOT with ANDROID_HOME
        run: echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "${GITHUB_ENV}"

      - name: Inject Firebase google-services.json when the secret is set
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          dest="frontend/android/app/google-services.json"
          if [[ -z "${GOOGLE_SERVICES_JSON}" ]]; then
            echo "GOOGLE_SERVICES_JSON is not set. FCM will not be included in this bundle."
            exit 0
          fi
          umask 077
          printf '%s\n' "${GOOGLE_SERVICES_JSON}" > "${dest}"
          echo "Wrote google-services.json."

      - name: Decode the upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" ]]; then
            echo "Missing GitHub secret ANDROID_KEYSTORE_BASE64."
            exit 1
          fi
          if [[ -z "${ANDROID_KEYSTORE_PASSWORD}" ]]; then
            echo "Missing GitHub secret ANDROID_KEYSTORE_PASSWORD."
            exit 1
          fi
          if [[ -z "${ANDROID_KEY_PASSWORD}" ]]; then
            echo "Missing GitHub secret ANDROID_KEY_PASSWORD."
            exit 1
          fi
          umask 077
          keystore_path="${RUNNER_TEMP}/upload-keystore.jks"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | tr -d '[:space:]' | base64 --decode > "${keystore_path}"
          if [[ ! -s "${keystore_path}" ]]; then
            echo "Decoded keystore is empty."
            exit 1
          fi
          echo "ANDROID_KEYSTORE_PATH=${keystore_path}" >> "${GITHUB_ENV}"
          chmod 600 "${keystore_path}"

      - name: Build the signed release bundle
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Report the AAB
        run: |
          set -euo pipefail
          aab="frontend/android/app/build/outputs/bundle/release/app-release.aab"
          test -s "${aab}"
          ls -lh "${aab}"

      - uses: actions/upload-artifact@v4
        with:
          name: enchanted-spoon-${{ inputs.track }}
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload to the Play testing track
        if: ${{ inputs.upload }}
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.enchantedspoon.app
          releaseFiles: frontend/android/app/build/outputs/bundle/release/app-release.aab
          tracks: ${{ inputs.track }}
          status: completed
