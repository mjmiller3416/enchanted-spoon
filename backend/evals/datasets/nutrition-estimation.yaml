    servings: 2
    ingredients_text: "- 1.0 whole romaine lettuce\n- 2.0 tbs caesar dressing\n- 0.25 cup parmesan cheese\n- 1.0 cup croutons"
    expected_calories: 220
    calorie_tolerance_pct: 55

