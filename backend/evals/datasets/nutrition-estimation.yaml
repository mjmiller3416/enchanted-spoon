# Nutrition-estimation golden set — STRUCTURED tier.
# `ingredients_text` mirrors the production format ("- {qty} {unit} {name}",
# nutrition_estimation.py:102-112). Nutrition is inherently an estimate, so the
# accuracy check is a GROSS-ERROR gate: per-serving calories must land within
# `calorie_tolerance_pct` of a hand-set reference. The stronger, exact signals are
# schema validity + macro↔calorie reconciliation (assertions/nutritionSchema.js),
# which apply to every row regardless of the reference.

- description: "grilled chicken breast"
  vars:
    recipe_name: "Grilled Chicken Breast"
    servings: 4
    ingredients_text: "- 4.0 whole chicken breast\n- 2.0 tbs olive oil\n- 1.0 tsp salt\n- 0.5 tsp black pepper"
    expected_calories: 365
    calorie_tolerance_pct: 50

- description: "spaghetti with marinara"
  vars:
    recipe_name: "Spaghetti with Marinara"
    servings: 4
    ingredients_text: "- 1.0 lbs spaghetti\n- 2.0 cup marinara sauce\n- 2.0 tbs olive oil\n- 0.25 cup parmesan cheese"
    expected_calories: 540
    calorie_tolerance_pct: 50

- description: "caesar salad"
  vars:
