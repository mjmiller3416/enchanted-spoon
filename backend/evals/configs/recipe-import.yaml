# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: "Recipe import — STRUCTURED tier (faithful normalization vs. ground truth)"

# Production: temperature 0.2, max_output_tokens 8192, JSON mode, thinking disabled
# (recipe_import/service.py:410-418). Per-model param reality — see README.
providers:
  - id: google:gemini-3.5-flash
    label: "gemini-3.5-flash"
    config:
      generationConfig:
        temperature: 0.2
        maxOutputTokens: 8192
        responseMimeType: application/json
        thinkingConfig:
          thinkingBudget: 0
  - id: openai:gpt-5.6-terra
    label: "gpt-5.6-terra"
    config:
      max_completion_tokens: 8192
      reasoning_effort: none
      response_format:
        type: json_object
  - id: anthropic:messages:claude-sonnet-5
    label: "claude-sonnet-5"
    config:
      max_tokens: 8192
      thinking:
        type: disabled

prompts:
  - file://../prompts/recipe-import.txt

tests: file://../datasets/recipe-import.yaml

defaultTest:
  assert:
    - type: javascript
      value: file://../assertions/recipeImport.js:parses
      metric: json_parse
    - type: javascript
      value: file://../assertions/recipeImport.js:noRecipeHandled
      metric: routing_correct
    - type: javascript
      value: file://../assertions/recipeImport.js:schemaValid
      metric: schema_valid
    - type: javascript
      value: file://../assertions/recipeImport.js:faithfulIngredients
      metric: ingredient_fidelity
    - type: javascript
      value: file://../assertions/recipeImport.js:nameMatch
      metric: name_match
