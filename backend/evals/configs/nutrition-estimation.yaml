# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: "Nutrition estimation — STRUCTURED tier (quality/correctness-dominated)"

# Production: temperature 0.3, max_output_tokens 2048, JSON mode, thinking disabled
# (nutrition_estimation.py:20-25,121-129). Per-model param reality — see README.
providers:
  - id: google:gemini-3.5-flash
    label: "gemini-3.5-flash"
    config:
      generationConfig:
        temperature: 0.3
        maxOutputTokens: 2048
        responseMimeType: application/json
        thinkingConfig:
          thinkingBudget: 0
  - id: openai:gpt-5.6-terra
    label: "gpt-5.6-terra"
    config:
      max_completion_tokens: 2048
      reasoning_effort: none
      response_format:
        type: json_object
  - id: anthropic:messages:claude-sonnet-5
    label: "claude-sonnet-5"
    config:
      max_tokens: 2048
      thinking:
        type: disabled

prompts:
  - file://../prompts/nutrition-estimation.txt

tests: file://../datasets/nutrition-estimation.yaml

defaultTest:
  assert:
    - type: javascript
      value: file://../assertions/nutrition.js:parses
      metric: json_parse
    - type: javascript
      value: file://../assertions/nutrition.js:schemaValid
      metric: schema_valid
    - type: javascript
      value: file://../assertions/nutrition.js:completeness
      metric: completeness
    - type: javascript
      value: file://../assertions/nutrition.js:macroReconciliation
      metric: macro_reconcile
    - type: javascript
      value: file://../assertions/nutrition.js:caloriesInBand
      metric: calories_in_band
