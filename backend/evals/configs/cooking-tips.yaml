# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: "Cooking tips — OPEN-ENDED tier (latency/cost-dominated; quality bar is 'good + varied')"

# Production baseline: gemini-3.5-flash, temperature 0.9, max_output_tokens 150,
# thinking disabled (cooking_tips.py:19-21,147-151) — matched faithfully below.
# ── Per-model params (probed against each API 2026-08-11) ───────────────────
#  • Gemini 3.5-flash: thinking disabled (thinkingBudget:0), production temp 0.9.
#    (gemini-3.6-flash was also evaluated — see scorecard-gemini-3.6.md; it can't
#    disable thinking, so it's slower/heavier and needs a larger cap. Swap the id
#    + set thinkingConfig:{includeThoughts:false} + maxOutputTokens:2048 to re-test.)
#  • GPT-5.6 Terra rejects `temperature` and `max_tokens`; uses max_completion_tokens
#    + reasoning_effort:none (fast, non-thinking — matches the single-shot design).
#  • Claude Sonnet 5 rejects `temperature`; run with thinking disabled.
providers:
  - id: google:gemini-3.5-flash
    label: "gemini-3.5-flash"
    config:
      generationConfig:
        temperature: 0.9
        maxOutputTokens: 150
        thinkingConfig:
          thinkingBudget: 0
  - id: openai:gpt-5.6-terra
    label: "gpt-5.6-terra"
    config:
      max_completion_tokens: 150
      reasoning_effort: none
  - id: anthropic:messages:claude-sonnet-5
    label: "claude-sonnet-5"
    config:
      max_tokens: 150
      thinking:
        type: disabled

prompts:
  - file://../prompts/cooking-tip.txt

tests: file://../datasets/cooking-tips.yaml

defaultTest:
  options:
    # LLM judge (grader). Claude family — see README "The judge & self-preference
    # bias"; the claude-sonnet-5 candidate's open-ended scores need a cross-check
    # with a non-Claude judge (change this to openai:gpt-5.6-terra and re-run).
    provider: anthropic:messages:claude-sonnet-4-6
  assert:
    - type: javascript
      value: "output.trim().length > 0 && !output.trim().startsWith('{') && !/^tip:/i.test(output.trim())"
      metric: format_ok
    - type: llm-rubric
      metric: tip_quality
      value: >
        Score this cooking tip. A great tip is: (1) specific and actionable, not
        generic ("season well" or "don't overcook" are bad); (2) 1-2 sentences;
        (3) includes at least one concrete detail — a time, temperature, ratio, or
        specific tool; (4) genuinely useful to a home cook; (5) NOT one of the
        overused tips the prompt bans (don't overcrowd the pan / reserve pasta water
        / pat protein dry) unless it adds a truly novel angle. Give a high score only
        if it is specific AND concrete AND on-topic for the requested category.
  # NOTE: `select-best` was removed — promptfoo's select-best grader call to the
  # Anthropic judge 400s ("at least one message is required"). The per-provider
  # `tip_quality` rubric score above already ranks the candidates; head-to-head
  # ordering is read from those scores.
